<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>常客資料管理 - 來點子站前旅店</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-dark: #163450;      
        --primary-gold: #c1a13a;      
        --bg-light: #f8fafc;          
        --border-color: #e2e8f0;      
    }
    * { box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif; }
    body { margin: 0; background-color: var(--bg-light); color: #334155; display: flex; flex-direction: column; min-height: 100vh; }

    .header { background-color: var(--primary-dark); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .header-left { display: flex; align-items: center; }
    .logo { width: 35px; height: 35px; border-radius: 8px; margin-right: 12px; border: 2px solid var(--primary-gold); }
    .hotel-name { font-size: 1.1rem; font-weight: 700; color: var(--primary-gold); }
    
    .nav-btn { background: transparent; border: 1px solid var(--primary-gold); color: var(--primary-gold); padding: 6px 12px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
    .nav-btn:hover { background: var(--primary-gold); color: var(--primary-dark); }

    .container { max-width: 900px; margin: 30px auto; padding: 0 15px; flex-grow: 1; width: 100%; }

    .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-bar input { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; }
    .search-bar input:focus { border-color: var(--primary-gold); }

    .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border-color); }
    
    .user-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .user-table th, .user-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 13px; }
    .user-table th { background: var(--bg-light); color: var(--primary-dark); white-space: nowrap; }
    .action-cell { display: flex; gap: 5px; }
    .btn-edit { background: var(--primary-dark); color: var(--primary-gold); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(22, 52, 80, 0.6); z-index: 999; backdrop-filter: blur(4px); }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 92%; max-width: 500px; background: white; border-radius: 16px; z-index: 1000; overflow: hidden; flex-direction: column; }
    .modal-header { padding: 15px 20px; background: white; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; color: var(--primary-dark); font-size: 1.15rem; font-weight: 700; }
    .modal-body { padding: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: #64748b; margin-bottom: 4px; font-weight: 600; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 8px; }
    .btn-save { background: var(--primary-dark); color: var(--primary-gold); padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: white; color: #334155; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCImo3zo7iCeo1quGZKt4c0GTrh_uSg3mSfQ&s" class="logo">
        <div class="hotel-name">常客資料管理中心</div>
    </div>
    <a href="dashboard.html" class="nav-btn">返回控制台</a>
</div>

<div class="container">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜尋姓名、身分證或電話號碼..." onkeyup="filterGuests()">
    </div>

    <div class="card" style="overflow-x: auto;">
        <table class="user-table">
            <thead>
                <tr>
                    <th>姓名</th>
                    <th>身分證/護照 (帳號ID)</th>
                    <th>聯絡電話</th>
                    <th>生日</th>
                    <th>國籍</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="guestTableBody">
                <tr><td colspan="6" style="text-align:center;">資料載入中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="editModalOverlay"></div>
<div class="modal" id="editModal">
    <div class="modal-header">
        <h3>✏️ 編輯常客資料</h3>
        <button onclick="closeModal()" style="background:none; border:none; font-size:24px; cursor:pointer; color:#64748b;">&times;</button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label>身分證/護照號碼 (主鍵，不可修改)</label>
            <input type="text" id="editIdNumber" readonly style="background:#f1f5f9; color:#94a3b8;">
        </div>
        <div class="form-group"><label>住客姓名</label><input type="text" id="editName"></div>
        <div class="form-group"><label>聯絡電話</label><input type="text" id="editPhone"></div>
        <div class="form-group"><label>出生年月日 (YYYY-MM-DD)</label><input type="text" id="editBirthday" placeholder="例如：1990-01-01"></div>
        <div class="form-group"><label>旅客國籍</label><input type="text" id="editCountry"></div>
    </div>
    <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-save" onclick="saveGuest()">💾 儲存修改</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCde1T_hHZOm7__3-1qcQ_NAeAbkz5MdFc",
    authDomain: "lightnessgogo-2d757.firebaseapp.com",
    projectId: "lightnessgogo-2d757",
    storageBucket: "lightnessgogo-2d757.firebasestorage.app",
    messagingSenderId: "1033105975068",
    appId: "1:1033105975068:web:915882758685a0d668bcd9",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

if(sessionStorage.getItem("isLoggedIn") !== "true") { window.location.href = "login.html"; }

let guestsData = [];

window.loadGuests = async function() {
    const tbody = document.getElementById("guestTableBody");
    try {
        const snap = await getDocs(collection(db, "frequent_guests"));
        guestsData = [];
        // doc.id 現在是身分證號/護照
        snap.forEach(doc => guestsData.push({ id: doc.id, ...doc.data() }));
        renderTable(guestsData);
    } catch(e) {
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:red;'>載入失敗</td></tr>";
    }
}

function renderTable(data) {
    const tbody = document.getElementById("guestTableBody");
    if(data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#94a3b8;'>尚無常客資料</td></tr>";
        return;
    }
    tbody.innerHTML = data.map(g => `
        <tr>
            <td><b>${g.name || '-'}</b></td>
            <td>${g.id}</td> <td>${g.phone || '-'}</td>
            <td>${g.birthday || '-'}</td>
            <td>${g.country || '台灣'}</td>
            <td class="action-cell">
                <button class="btn-edit" onclick="openEdit('${g.id}')">編輯</button>
                <button class="btn-delete" onclick="deleteGuest('${g.id}')">刪除</button>
            </td>
        </tr>
    `).join("");
}

window.filterGuests = function() {
    const keyword = document.getElementById("searchInput").value.toLowerCase();
    const filtered = guestsData.filter(g => 
        (g.name && g.name.toLowerCase().includes(keyword)) || 
        (g.id && g.id.toLowerCase().includes(keyword)) || 
        (g.phone && g.phone.includes(keyword))
    );
    renderTable(filtered);
}

window.openEdit = function(idVal) {
    const g = guestsData.find(x => x.id === idVal);
    if(g) {
        // 將 ID 代入唯讀欄位
        document.getElementById("editIdNumber").value = g.id;
        document.getElementById("editName").value = g.name || "";
        document.getElementById("editPhone").value = g.phone || "";
        document.getElementById("editBirthday").value = g.birthday || "";
        document.getElementById("editCountry").value = g.country || "";
        
        document.getElementById("editModalOverlay").style.display = "block";
        document.getElementById("editModal").style.display = "flex";
    }
}

window.closeModal = function() {
    document.getElementById("editModalOverlay").style.display = "none";
    document.getElementById("editModal").style.display = "none";
}

window.saveGuest = async function() {
    // 主鍵是 idNumber
    const idVal = document.getElementById("editIdNumber").value;
    const newData = {
        name: document.getElementById("editName").value,
        phone: document.getElementById("editPhone").value,
        idNumber: idVal,
        birthday: document.getElementById("editBirthday").value,
        country: document.getElementById("editCountry").value
    };
    try {
        await setDoc(doc(db, "frequent_guests", idVal), newData);
        alert("✅ 常客資料更新成功");
        closeModal();
        loadGuests();
    } catch(e) { alert("更新失敗"); }
}

window.deleteGuest = async function(idVal) {
    if(confirm(`確定要刪除這筆常客資料嗎？ (身分證/護照：${idVal})`)) {
        try {
            await deleteDoc(doc(db, "frequent_guests", idVal));
            loadGuests();
        } catch(e) { alert("刪除失敗"); }
    }
}

loadGuests();
</script>
</body>
</html>
