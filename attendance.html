<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>出/退勤打卡 - 來點子站前旅店</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        var(--primary-dark): #163450;      
        var(--primary-gold): #c1a13a;      
        --bg-light: #f8fafc;          
        --border-color: #e2e8f0;      
        --text-main: #334155;
        --text-muted: #64748b;
    }
    * { box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif; }
    body { margin: 0; background-color: var(--bg-light); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

    .header { background-color: #163450; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); position: sticky; top: 0; z-index: 100; }
    .header-left { display: flex; align-items: center; }
    .logo { width: 40px; height: 40px; border-radius: 8px; margin-right: 12px; border: 2px solid #c1a13a; }
    .hotel-name { font-size: 1.15rem; font-weight: 700; letter-spacing: 1.5px; color: #c1a13a; }
    .nav-btn { background: transparent; border: 1px solid #c1a13a; color: #c1a13a; padding: 6px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.2s; }
    .nav-btn:hover { background: #c1a13a; color: #163450; }

    .container { max-width: 800px; margin: 30px auto; padding: 0 15px; flex-grow: 1; width: 100%; }

    .card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; border: 1px solid var(--border-color); text-align: center; }
    
    .clock-display { font-size: 3.5rem; font-weight: 700; color: #163450; margin: 10px 0; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
    .date-display { font-size: 1.1rem; color: var(--text-muted); font-weight: 500; margin-bottom: 25px; }

    .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    .btn-punch { flex: 1; min-width: 140px; max-width: 250px; padding: 15px; font-size: 1.1rem; font-weight: 700; border-radius: 12px; cursor: pointer; border: none; transition: all 0.2s; color: white; display: flex; flex-direction: column; align-items: center; gap: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn-punch:active { transform: scale(0.95); }
    .btn-punch:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(80%); box-shadow: none; }
    
    .btn-in { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-out { background: linear-gradient(135deg, #f59e0b, #d97706); }

    .status-badge { display: inline-block; padding: 6px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; background: #e0f2fe; color: #1e3a8a; border: 1px solid #bfdbfe; }

    .table-container { overflow-x: auto; background: white; border-radius: 12px; border: 1px solid var(--border-color); margin-top: 15px; }
    .history-table { width: 100%; border-collapse: collapse; min-width: 500px; text-align: left; }
    .history-table th, .history-table td { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    .history-table th { background: #f8fafc; color: #163450; font-weight: 700; white-space: nowrap; }
    .history-table tr:hover td { background: #f1f5f9; }
    
    .tag { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
    .tag-normal { background: #dcfce7; color: #166534; }
    .tag-late { background: #fee2e2; color: #991b1b; }

    .tech-support-banner { display: flex; justify-content: center; align-items: center; text-align: center; padding: 15px !important; font-size: 12px; font-weight: 600; color: var(--text-muted); background-color: #e2e8f0; margin-top: auto; letter-spacing: 0.5px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.03); padding-bottom: calc(15px + env(safe-area-inset-bottom)); width: 100%; }
</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCImo3zo7iCeo1quGZKt4c0GTrh_uSg3mSfQ&s" class="logo">
        <div class="hotel-name">出/退勤打卡系統</div>
    </div>
    <a href="dashboard.html" class="nav-btn">返回控制台</a>
</div>

<div class="container">
    <div class="card">
        <div class="status-badge" id="currentStatus">當前狀態：尚未打卡</div>
        <div class="date-display" id="dateDisplay">2026年04月08日 (週三)</div>
        <div class="clock-display" id="clockDisplay">00:00:00</div>
        
        <div class="btn-group">
            <button class="btn-punch btn-in" id="btnClockIn" onclick="clockAction('in')">
                <span style="font-size: 1.5rem;">👋</span> 上班打卡
            </button>
            <button class="btn-punch btn-out" id="btnClockOut" onclick="clockAction('out')" disabled>
                <span style="font-size: 1.5rem;">🏠</span> 下班打卡
            </button>
        </div>
        <div style="margin-top: 15px; font-size: 12px; color: #94a3b8;">
            * 系統已記錄您的 IP 與裝置資訊以核實打卡位置
        </div>
    </div>

    <div class="card" style="text-align: left; padding: 20px;">
        <h3 style="margin: 0 0 15px 0; color: #163450; font-size: 1.1rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;">📋 本月打卡紀錄</h3>
        <div class="table-container">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>上班時間</th>
                        <th>下班時間</th>
                        <th>狀態判定</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <tr>
                        <td>2026-04-07</td>
                        <td>08:55</td>
                        <td>18:05</td>
                        <td><span class="tag tag-normal">正常</span></td>
                    </tr>
                    <tr>
                        <td>2026-04-06</td>
                        <td>09:12</td>
                        <td>18:10</td>
                        <td><span class="tag tag-late">遲到</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="tech-support-banner">
    👨‍💻 來點子旅店資訊部 班長 所提供的技術支援
</div>

<script>
    // 權限檢查
    if(sessionStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "login.html";
    }

    // 時鐘更新邏輯
    function updateClock() {
        const now = new Date();
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        document.getElementById('dateDisplay').innerText = 
            `${now.getFullYear()}年${String(now.getMonth()+1).padStart(2,'0')}月${String(now.getDate()).padStart(2,'0')}日 (週${days[now.getDay()]})`;
        
        document.getElementById('clockDisplay').innerText = 
            `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 模擬打卡邏輯
    function clockAction(type) {
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        if (type === 'in') {
            alert(`✅ 上班打卡成功！時間：${timeStr}`);
            document.getElementById('btnClockIn').disabled = true;
            document.getElementById('btnClockOut').disabled = false;
            document.getElementById('currentStatus').innerText = "當前狀態：🟢 執勤中";
            document.getElementById('currentStatus').style.background = "#dcfce7";
            document.getElementById('currentStatus').style.color = "#166534";
            document.getElementById('currentStatus').style.borderColor = "#86efac";
        } else {
            alert(`🏠 下班打卡成功！辛苦了！時間：${timeStr}`);
            document.getElementById('btnClockOut').disabled = true;
            document.getElementById('currentStatus').innerText = "當前狀態：⚪ 已下班";
            document.getElementById('currentStatus').style.background = "#f1f5f9";
            document.getElementById('currentStatus').style.color = "#475569";
            document.getElementById('currentStatus').style.borderColor = "#cbd5e1";
        }
    }
</script>
</body>
</html>
