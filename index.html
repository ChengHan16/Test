<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>日本租屋搜尋工具</title>

<style>

body{

font-family:Arial;

background:#eef2f7;

text-align:center;

}

.container{

width:900px;

margin:auto;

background:white;

padding:30px;

margin-top:50px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,0.1);

}

input{

width:600px;

padding:12px;

margin:10px;

border-radius:8px;

border:1px solid #ccc;

}

select{

padding:10px;

}

button{

padding:12px 25px;

background:#2563eb;

color:white;

border:none;

border-radius:8px;

cursor:pointer;

}

img{

width:220px;

margin:10px;

border-radius:10px;

box-shadow:0 5px 15px rgba(0,0,0,0.2);

}

.card{

background:#f8fafc;

padding:15px;

margin:20px;

border-radius:10px;

}

</style>

</head>

<body>

<div class="container">

<h2>

日本不動產圖片抓取工具

</h2>

<select id="mode">

<option value="url">

物件URL

</option>

<option value="keyword">

關鍵字

</option>

</select>

<br>

<input id="search"
placeholder="輸入URL或關鍵字">

<br>

<button onclick="start()">

搜尋

</button>

<button onclick="loadCache()">

讀取歷史圖片

</button>

<div id="result">

</div>

</div>

<script>

async function start(){

let mode=

document.getElementById(

"mode"

).value;

let text=

document.getElementById(

"search"

).value;

if(mode=="url"){

crawl(text);

}

else{

alert(

"純HTML無法直接搜尋網站\n請貼物件URL"

);

}

}

async function crawl(url){

let proxy=

"https://api.allorigins.win/raw?url="

+encodeURIComponent(url);

let res=

await fetch(proxy);

let html=

await res.text();

let parser=

new DOMParser();

let doc=

parser.parseFromString(

html,

"text/html"

);

let imgs=

doc.querySelectorAll("img");

let list=[];

imgs.forEach(

img=>{

let src=

img.src;

if(src){

list.push(src);

}

}

);

show(list);

saveCache(

url,

list

);

}

function show(images){

let html="";

images.forEach(

img=>{

html+=

`<img src="${img}">`;

}

);

document

.getElementById(

"result"

).innerHTML=

html;

}

function saveCache(

url,

images

){

let data={

url:url,

images:images,

time:

new Date()

};

localStorage.setItem(

url,

JSON.stringify(data)

);

}

function loadCache(){

let html="";

for(let i=0;

i<localStorage.length;

i++){

let key=

localStorage.key(i);

let data=

JSON.parse(

localStorage.getItem(

key

)

);

data.images.forEach(

img=>{

html+=

`<img src="${img}">`;

}

);

}

document

.getElementById(

"result"

).innerHTML=

html;

}

</script>

</body>

</html>
