<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 物體尺寸模擬器 (AutoCAD 風格)</title>
    <style>
        body { margin: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; }
        #sidebar { width: 320px; padding: 20px; background: white; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 10; height: 100vh; overflow-y: auto; }
        #canvas-container { flex-grow: 1; height: 100vh; overflow: hidden; position: relative; }
        h2 { font-size: 1.2rem; color: #333; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #555; }
        input[type="number"], select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { display: block; width: 100%; padding: 10px; margin-top: 10px; background-color: #0078D7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #005a9e; }
        .btn-danger { background-color: #d13438; }
        .btn-danger:hover { background-color: #a80000; }
        .btn-secondary { background-color: #6c757d; margin-top: 5px; }
        .btn-secondary:hover { background-color: #5a6268; }
        .converter { background: #e9ecef; padding: 10px; border-radius: 4px; margin-top: 20px; font-size: 0.85rem; }
        .converter input { width: 45%; display: inline-block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <h2>新增物體</h2>
        <div class="input-group">
            <label for="unit">輸入單位</label>
            <select id="unit">
                <option value="mm">毫米 (mm)</option>
                <option value="cm">公分 (cm)</option>
            </select>
        </div>
        <div class="input-group">
            <label for="length">長度 / 深度 (X軸)</label>
            <input type="number" id="length" value="240" step="0.1">
        </div>
        <div class="input-group">
            <label for="width">寬度 (Z軸)</label>
            <input type="number" id="width" value="140" step="0.1">
        </div>
        <div class="input-group">
            <label for="height">高度 (Y軸)</label>
            <input type="number" id="height" value="61" step="0.1">
        </div>
        <button class="btn" onclick="addObject()">加入場景</button>
        <button class="btn btn-danger" onclick="clearScene()">清除全部</button>

        <div class="converter">
            <strong>📐 快速單位轉換工具</strong><br><br>
            <input type="number" id="conv-cm" placeholder="cm" oninput="convert('cm')"> cm = 
            <input type="number" id="conv-mm" placeholder="mm" oninput="convert('mm')"> mm
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 初始化 Three.js 場景 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f7f6); // AutoCAD 風格淺灰背景

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 10000);
        camera.position.set(500, 400, 500);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 加入網格線 (AutoCAD 風格)
        const gridHelper = new THREE.GridHelper(2000, 100, 0x888888, 0xcccccc);
        scene.add(gridHelper);

        // 加入光源
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);

        // --- 全域變數 ---
        let objects = [];
        let currentXOffset = 0; // 用於並排顯示物體

        // --- 功能：加入物體 ---
        function addObject() {
            const unit = document.getElementById('unit').value;
            let l = parseFloat(document.getElementById('length').value);
            let w = parseFloat(document.getElementById('width').value);
            let h = parseFloat(document.getElementById('height').value);

            if (isNaN(l) || isNaN(w) || isNaN(h)) {
                alert("請輸入有效的數字！");
                return;
            }

            // 統一將內部運算單位轉為 mm
            if (unit === 'cm') {
                l *= 10;
                w *= 10;
                h *= 10;
            }

            // 建立幾何體
            const geometry = new THREE.BoxGeometry(l, h, w); // Three.js 中 Y 是高度
            
            // 建立材質 (半透明藍色，類似 AutoCAD 概念圖)
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x82b1ff, 
                transparent: true, 
                opacity: 0.6,
                shininess: 30
            });
            const cube = new THREE.Mesh(geometry, material);

            // 建立邊線 (黑線框，增強工程圖感)
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
            cube.add(line); // 將線框綁定在方塊上

            // 設定位置 (將物體底部貼齊網格，並依照 currentXOffset 往右排列)
            cube.position.y = h / 2; 
            cube.position.x = currentXOffset + (l / 2);
            
            // 更新下一個物體的起始 X 座標 (保留 50mm 的間距)
            currentXOffset += l + 50; 

            scene.add(cube);
            objects.push(cube);

            // 調整攝影機焦點
            controls.target.set(currentXOffset / 2, 0, 0);
        }

        // --- 功能：清除場景 ---
        function clearScene() {
            objects.forEach(obj => scene.remove(obj));
            objects = [];
            currentXOffset = 0;
            controls.target.set(0, 0, 0);
        }

        // --- 功能：單位轉換小工具 ---
        function convert(from) {
            const cmInput = document.getElementById('conv-cm');
            const mmInput = document.getElementById('conv-mm');
            if (from === 'cm') {
                mmInput.value = (parseFloat(cmInput.value) * 10) || '';
            } else {
                cmInput.value = (parseFloat(mmInput.value) / 10) || '';
            }
        }

        // --- 渲染迴圈 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 視窗縮放適應 ---
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
