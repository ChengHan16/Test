<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>網頁版轉珠小遊戲</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            touch-action: none; /* 防止手機滑動干擾 */
        }
        h1 { margin: 10px 0; }
        #stats {
            display: flex;
            justify-content: space-between;
            width: 320px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-template-rows: repeat(5, 50px);
            gap: 2px;
            background-color: #34495e;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .orb {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 50%;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s;
        }
        .orb:active { cursor: grabbing; transform: scale(1.1); }
        .orb.dragging { opacity: 0.5; transform: scale(1.2); z-index: 10; }
        .orb.matched { animation: pop 0.3s forwards; }
        
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }
        
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h1>簡易轉珠原型</h1>
    <div id="stats">
        <div>Combo: <span id="combo-display">0</span></div>
        <div>時間: <span id="time-display">無限</span></div>
    </div>
    <div id="board"></div>
    <button onclick="resetBoard()">重置盤面</button>

<script>
    const COLS = 6;
    const ROWS = 5;
    const ORB_TYPES = ['💧', '🔥', '🌿', '☀️', '🌙', '💖']; // 水, 火, 木, 光, 暗, 心
    let board = [];
    
    let isDragging = false;
    let dragStartIndex = -1;
    let currentDragIndex = -1;
    let comboCount = 0;

    const boardElement = document.getElementById('board');
    const comboDisplay = document.getElementById('combo-display');

    // 初始化盤面
    function initBoard() {
        board = [];
        for (let i = 0; i < ROWS * COLS; i++) {
            board.push(getRandomOrb());
        }
        // 確保初始盤面沒有可消除的符石 (簡化版：僅重新生成直到無消除)
        while(checkMatches(false).length > 0) {
            for (let i = 0; i < ROWS * COLS; i++) {
                board[i] = getRandomOrb();
            }
        }
        renderBoard();
    }

    function getRandomOrb() {
        return ORB_TYPES[Math.floor(Math.random() * ORB_TYPES.length)];
    }

    // 渲染盤面
    function renderBoard() {
        boardElement.innerHTML = '';
        for (let i = 0; i < board.length; i++) {
            const orb = document.createElement('div');
            orb.classList.add('orb');
            orb.dataset.index = i;
            orb.innerText = board[i] === null ? '' : board[i];
            
            // 滑鼠與觸控事件 (支援手機與電腦)
            orb.addEventListener('mousedown', startDrag);
            orb.addEventListener('mouseenter', dragOver);
            orb.addEventListener('mouseup', endDrag);
            
            orb.addEventListener('touchstart', startDrag, {passive: false});
            orb.addEventListener('touchmove', touchMove, {passive: false});
            orb.addEventListener('touchend', endDrag);

            boardElement.appendChild(orb);
        }
    }

    function startDrag(e) {
        if(e.type === 'touchstart') e.preventDefault(); // 防止螢幕捲動
        isDragging = true;
        dragStartIndex = parseInt(e.target.dataset.index);
        currentDragIndex = dragStartIndex;
        comboCount = 0;
        comboDisplay.innerText = comboCount;
        e.target.classList.add('dragging');
    }

    function dragOver(e) {
        if (!isDragging) return;
        const targetIndex = parseInt(e.target.dataset.index);
        if (targetIndex !== currentDragIndex && !isNaN(targetIndex)) {
            swapOrbs(currentDragIndex, targetIndex);
            currentDragIndex = targetIndex;
            renderBoard(); // 重新渲染以顯示交換
            // 保持正在拖曳的視覺效果
            boardElement.children[currentDragIndex].classList.add('dragging');
        }
    }

    function touchMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const touch = e.touches[0];
        const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
        
        if (targetElement && targetElement.classList.contains('orb')) {
            const targetIndex = parseInt(targetElement.dataset.index);
            if (targetIndex !== currentDragIndex && !isNaN(targetIndex)) {
                swapOrbs(currentDragIndex, targetIndex);
                currentDragIndex = targetIndex;
                renderBoard();
                boardElement.children[currentDragIndex].classList.add('dragging');
            }
        }
    }

    function swapOrbs(idx1, idx2) {
        const temp = board[idx1];
        board[idx1] = board[idx2];
        board[idx2] = temp;
    }

    function endDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        renderBoard(); // 移除拖曳狀態
        resolveMatches(); // 開始計算消除
    }

    // 尋找可消除的符石
    function checkMatches(markForRemoval = true) {
        let matchedIndices = new Set();

        // 檢查橫向
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS - 2; c++) {
                let idx1 = r * COLS + c;
                let idx2 = r * COLS + c + 1;
                let idx3 = r * COLS + c + 2;
                if (board[idx1] && board[idx1] === board[idx2] && board[idx1] === board[idx3]) {
                    matchedIndices.add(idx1).add(idx2).add(idx3);
                }
            }
        }

        // 檢查縱向
        for (let c = 0; c < COLS; c++) {
            for (let r = 0; r < ROWS - 2; r++) {
                let idx1 = r * COLS + c;
                let idx2 = (r + 1) * COLS + c;
                let idx3 = (r + 2) * COLS + c;
                if (board[idx1] && board[idx1] === board[idx2] && board[idx1] === board[idx3]) {
                    matchedIndices.add(idx1).add(idx2).add(idx3);
                }
            }
        }

        return Array.from(matchedIndices);
    }

    // 處理消除與掉落邏輯 (遞迴)
    function resolveMatches() {
        const matches = checkMatches();
        
        if (matches.length > 0) {
            comboCount++;
            comboDisplay.innerText = comboCount;

            // 播放消除動畫
            matches.forEach(idx => {
                boardElement.children[idx].classList.add('matched');
            });

            // 等待動畫結束後移除並掉落
            setTimeout(() => {
                matches.forEach(idx => board[idx] = null);
                applyGravity();
                renderBoard();
                
                // 延遲一下再檢查連鎖 (Chain Combo)
                setTimeout(resolveMatches, 300);
            }, 300);
        }
    }

    // 符石掉落與生成新符石
    function applyGravity() {
        for (let c = 0; c < COLS; c++) {
            let columnOrbs = [];
            // 從底部往上收集該列所有非空的符石
            for (let r = ROWS - 1; r >= 0; r--) {
                let idx = r * COLS + c;
                if (board[idx] !== null) {
                    columnOrbs.push(board[idx]);
                }
            }
            
            // 補充新的隨機符石
            while (columnOrbs.length < ROWS) {
                columnOrbs.push(getRandomOrb());
            }

            // 將符石放回盤面 (從底部開始放)
            for (let r = ROWS - 1; r >= 0; r--) {
                let idx = r * COLS + c;
                board[idx] = columnOrbs.shift();
            }
        }
    }

    function resetBoard() {
        comboCount = 0;
        comboDisplay.innerText = comboCount;
        initBoard();
    }

    // 啟動遊戲
    window.onload = initBoard;

</script>
</body>
</html>
