<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>左右滑動行事曆</title>
  <style>
    /* 基本重置與背景 */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* 行事曆外框 (限制可視範圍) */
    .calendar-wrapper {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* 滾動容器設定 */
    .calendar-scroll {
      display: flex;
      overflow-x: auto;
      /* 關鍵 CSS：設定橫向滾動捕捉 */
      scroll-snap-type: x mandatory;
      /* 隱藏卷軸讓畫面更乾淨 */
      scrollbar-width: none; 
      -ms-overflow-style: none; 
    }
    
    .calendar-scroll::-webkit-scrollbar {
      display: none;
    }

    /* 單一月份容器 */
    .month {
      /* 確保每個月份剛好佔滿整個視窗寬度 */
      flex: 0 0 100%;
      scroll-snap-align: start;
      padding: 20px;
      box-sizing: border-box;
    }

    /* 標題與星期 */
    .month-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: bold;
      color: #888;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    /* 日期網格 */
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day {
      display: flex;
      justify-content: center;
      align-items: center;
      aspect-ratio: 1 / 1; /* 讓格子保持正方形 */
      border-radius: 50%;
      color: #444;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .day:hover:not(.empty) {
      background-color: #e0e0e0;
    }

    .day.empty {
      cursor: default;
    }

    /* 當天日期高亮 */
    .day.today {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 123, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="calendar-wrapper">
    <div class="calendar-scroll" id="calendar-scroll">
      </div>
  </div>

  <script>
    const scrollContainer = document.getElementById('calendar-scroll');
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth();

    // 建立單一月份的 DOM 元素
    function createMonthElement(year, month) {
      // 處理跨年月份的計算
      const date = new Date(year, month, 1);
      const actualYear = date.getFullYear();
      const actualMonth = date.getMonth();

      const monthDiv = document.createElement('div');
      monthDiv.className = 'month';

      // 加入月份標題
      const title = document.createElement('div');
      title.className = 'month-title';
      title.innerText = `${actualYear}年 ${actualMonth + 1}月`;
      monthDiv.appendChild(title);

      // 加入星期標題
      const weekdaysDiv = document.createElement('div');
      weekdaysDiv.className = 'weekdays';
      const daysOfWeek = ['日', '一', '二', '三', '四', '五', '六'];
      daysOfWeek.forEach(d => {
        const span = document.createElement('div');
        span.innerText = d;
        weekdaysDiv.appendChild(span);
      });
      monthDiv.appendChild(weekdaysDiv);

      // 產生日期網格
      const daysDiv = document.createElement('div');
      daysDiv.className = 'days';

      const firstDayIndex = date.getDay(); // 該月第一天是星期幾
      const daysInMonth = new Date(actualYear, actualMonth + 1, 0).getDate(); // 該月總天數

      // 填充第一天前面的空白格子
      for(let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'day empty';
        daysDiv.appendChild(emptyDiv);
      }

      // 填充實際日期
      for(let i = 1; i <= daysInMonth; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'day';
        dayDiv.innerText = i;
        
        // 標記今天
        if (actualYear === today.getFullYear() && 
            actualMonth === today.getMonth() && 
            i === today.getDate()) {
          dayDiv.classList.add('today');
        }
        daysDiv.appendChild(dayDiv);
      }

      monthDiv.appendChild(daysDiv);
      return monthDiv;
    }

    // 初始化：預先載入過去與未來的月份
    // 設定 range = 12 代表載入過去 12 個月、當月、未來 12 個月 (共 25 個月)
    const range = 12; 
    
    for (let i = -range; i <= range; i++) {
      const m = createMonthElement(currentYear, currentMonth + i);
      scrollContainer.appendChild(m);
    }

    // 頁面載入後，自動將卷軸滾動到「當前月份」(也就是正中間的那一個)
    window.addEventListener('load', () => {
      // 取得單一月份的寬度
      const monthWidth = scrollContainer.clientWidth;
      // 將卷軸水平位移到正確的月份
      scrollContainer.scrollLeft = monthWidth * range;
    });
  </script>

</body>
</html>
